name: Android Verify

on:
  pull_request:
    paths:
      - "apps/acbooks-android/**"
      - ".github/workflows/android-verify.yml"
  push:
    paths:
      - "apps/acbooks-android/**"
      - ".github/workflows/android-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Android Debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            apps/acbooks-android/gradle/libs.versions.toml
            apps/acbooks-android/gradle/wrapper/gradle-wrapper.properties
            apps/acbooks-android/**/*.gradle.kts

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-37.2 build-tools;37.0.0

      - name: Build debug APK
        working-directory: apps/acbooks-android
        run: bash ./ci-assemble.sh Debug
