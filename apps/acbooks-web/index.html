<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#EDF1F6" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/acbooks-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/acbooks-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/acbooks-48.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/icons/acbooks-64.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>acbooks</title>
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("acbooks-language");
          const preference =
            stored === "zh-CN" || stored === "en" || stored === "system"
              ? stored
              : "system";
          const languages =
            preference === "system"
              ? navigator.languages.length > 0
                ? navigator.languages
                : [navigator.language]
              : [preference];
          const match = languages
            .map((language) => language.toLowerCase())
            .find(
              (language) =>
                language === "zh" ||
                language.startsWith("zh-") ||
                language === "en" ||
                language.startsWith("en-"),
            );
          document.documentElement.lang =
            match !== undefined && (match === "zh" || match.startsWith("zh-"))
              ? "zh-CN"
              : "en";
        } catch {
          document.documentElement.lang = "en";
        }
      })();
    </script>
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("acbooks-theme");
          const mode =
            stored === "light" || stored === "dark" || stored === "system"
              ? stored
              : "system";
          const dark =
            mode === "dark" ||
            (mode === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute("content", dark ? "#10151E" : "#EDF1F6");
        } catch {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
